services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      TELEMETRY_DB_DSN: postgresql://telemetry:telemetry@postgres:5432/telemetry
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: telemetry
      POSTGRES_USER: telemetry
      POSTGRES_PASSWORD: telemetry
    ports:
      - "5432:5432"
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
